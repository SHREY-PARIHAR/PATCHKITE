<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Patchkite — Website Audit Report</title>

  <meta
    name="description"
    content="Patchkite website quality audit report."
  />

  <style>
    /* =========================================================
       PATCHKITE REPORT
       Final Report UI
       ========================================================= */

    :root {
      --cream: #f7f5ef;
      --paper: #fffefa;
      --paper-2: #f1eee6;

      --ink: #111111;
      --muted: #77746e;
      --soft-muted: #9a968e;

      --teal-dark: #00524d;
      --teal: #48a89a;
      --teal-light: #cbefeb;

      --blue: #79b8ff;
      --blue-light: #dceeff;

      --violet: #a99cff;
      --violet-light: #eeeaff;

      --pink: #f3a9d8;
      --pink-light: #f9dded;

      --orange: #ffd69a;
      --orange-light: #fff0d2;

      --green: #54c49a;
      --green-light: #ddf6eb;

      --red: #ef7e7e;
      --red-light: #fde4e4;

      --yellow: #f4ce6b;
      --yellow-light: #fff3ca;

      --border: rgba(17, 17, 17, 0.09);

      --shadow:
        0 24px 70px rgba(24, 32, 31, 0.09),
        0 5px 20px rgba(24, 32, 31, 0.04);

      --radius-xl: 32px;
      --radius-lg: 26px;
      --radius-md: 20px;
      --radius-sm: 15px;

      --aurora-text-1: #00524d;
      --aurora-text-2: #1c6f8c;
      --aurora-text-3: #5b4b99;
      --aurora-text-4: #8a3f77;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 8% 18%,
          rgba(72, 168, 154, 0.17),
          transparent 23%
        ),
        radial-gradient(
          circle at 94% 14%,
          rgba(243, 169, 216, 0.20),
          transparent 22%
        ),
        radial-gradient(
          circle at 88% 84%,
          rgba(255, 214, 154, 0.23),
          transparent 25%
        ),
        var(--cream);

      color: var(--ink);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    /* =========================================================
       BACKGROUND
       ========================================================= */

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      pointer-events: none;
      filter: blur(1px);
    }

    body::before {
      width: 310px;
      height: 310px;
      left: -160px;
      top: 37%;

      border-radius: 58% 42% 48% 52%;

      background:
        linear-gradient(
          145deg,
          rgba(72, 168, 154, 0.42),
          rgba(203, 239, 235, 0.05)
        );

      animation: blobDriftA 16s ease-in-out infinite;
    }

    body::after {
      width: 360px;
      height: 360px;
      right: -180px;
      bottom: 5%;

      border-radius: 48% 52% 44% 56%;

      background:
        linear-gradient(
          145deg,
          rgba(255, 214, 154, 0.48),
          rgba(243, 169, 216, 0.06)
        );

      animation: blobDriftB 19s ease-in-out infinite;
      animation-delay: -4s;
    }

    @keyframes blobDriftA {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }

      50% {
        transform: translate(22px, -16px) scale(1.06) rotate(8deg);
      }

      100% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
    }

    @keyframes blobDriftB {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }

      50% {
        transform: translate(-18px, 18px) scale(1.05) rotate(-7deg);
      }

      100% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
    }

    /* =========================================================
       AURORA TEXT
       ========================================================= */

    .aurora-text {
      color: var(--ink);

      background-image:
        linear-gradient(
          90deg,
          var(--aurora-text-1),
          var(--aurora-text-2),
          var(--aurora-text-3),
          var(--aurora-text-4),
          var(--aurora-text-1)
        );

      background-size: 300% 100%;

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;
      color: transparent;

      animation: auroraShift 10s linear infinite;
    }

    @supports not (background-clip: text) {
      .aurora-text {
        background: none;
        color: var(--ink);
        -webkit-text-fill-color: initial;
      }
    }

    @keyframes auroraShift {
      0% {
        background-position: 0% 50%;
      }

      100% {
        background-position: 300% 50%;
      }
    }

    /* =========================================================
       ENTRANCE ANIMATIONS
       ========================================================= */

    @keyframes cardRise {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes itemRise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .grid > .card {
      animation:
        cardRise 0.7s
        cubic-bezier(0.16, 1, 0.3, 1)
        both;
    }

    .grid > .card:nth-child(1) {
      animation-delay: 0s;
    }

    .grid > .card:nth-child(2) {
      animation-delay: 0.05s;
    }

    .grid > .card:nth-child(3) {
      animation-delay: 0.10s;
    }

    .grid > .card:nth-child(4) {
      animation-delay: 0.15s;
    }

    .grid > .card:nth-child(5) {
      animation-delay: 0.20s;
    }

    .grid > .card:nth-child(6) {
      animation-delay: 0.25s;
    }

    .grid > .card:nth-child(7) {
      animation-delay: 0.30s;
    }

    .grid > .card:nth-child(8) {
      animation-delay: 0.35s;
    }

    .grid > .card:nth-child(9) {
      animation-delay: 0.40s;
    }

    .footer-card {
      animation:
        cardRise 0.7s
        cubic-bezier(0.16, 1, 0.3, 1)
        both;
    }

    .footer-card:nth-child(1) {
      animation-delay: 0.45s;
    }

    .footer-card:nth-child(2) {
      animation-delay: 0.50s;
    }

    /* =========================================================
       TOP BAR
       ========================================================= */

    .topbar {
      width: min(1260px, calc(100% - 40px));
      margin: 26px auto 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-text {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;

      color: var(--teal-dark);

      padding: 5px 10px 5px 8px;
      border-radius: 999px;

      background: rgba(72, 168, 154, 0.13);
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--teal);

      box-shadow:
        0 0 0 0 rgba(72, 168, 154, 0.55);

      animation: liveDotPulse 1.8s ease-out infinite;
    }

    @keyframes liveDotPulse {
      0% {
        box-shadow:
          0 0 0 0 rgba(72, 168, 154, 0.55);
      }

      70% {
        box-shadow:
          0 0 0 7px rgba(72, 168, 154, 0);
      }

      100% {
        box-shadow:
          0 0 0 0 rgba(72, 168, 154, 0);
      }
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .top-btn {
      border: 1px solid rgba(17, 17, 17, 0.08);

      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);

      padding: 11px 18px;
      border-radius: 999px;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .top-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 28px rgba(17, 17, 17, 0.08);

      background: white;
    }

    .top-btn.primary {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    /* =========================================================
       MAIN
       ========================================================= */

    .report-shell {
      width: min(1260px, calc(100% - 40px));
      margin: 0 auto 70px;
    }

    .grid {
      display: grid;

      grid-template-columns:
        1.55fr
        0.9fr;

      gap: 16px;
    }

    .card {
      position: relative;
      overflow: hidden;

      background: rgba(255, 255, 255, 0.93);

      border:
        1px solid
        rgba(255, 255, 255, 0.8);

      border-radius: var(--radius-xl);

      box-shadow: var(--shadow);
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero-card {
      min-height: 565px;

      padding:
        62px
        62px
        48px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-card::before {
      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      right: -95px;
      top: -95px;

      border-radius:
        47%
        53%
        55%
        45%;

      background:
        linear-gradient(
          145deg,
          rgba(255, 213, 152, 0.76),
          rgba(245, 172, 218, 0.72)
        );

      animation:
        blobDriftA
        13s
        ease-in-out
        infinite;
    }

    .hero-card::after {
      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      left: -95px;
      bottom: -90px;

      border-radius:
        52%
        48%
        43%
        57%;

      background:
        linear-gradient(
          145deg,
          rgba(110, 207, 194, 0.52),
          rgba(105, 180, 255, 0.25)
        );

      animation:
        blobDriftB
        15s
        ease-in-out
        infinite;

      animation-delay: -3s;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 900;

      letter-spacing: 0.22em;
      text-transform: uppercase;

      color: #69655e;
    }

    .hero-title {
      max-width: 820px;

      margin-top: 26px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          52px,
          6vw,
          88px
        );

      line-height: 0.94;

      letter-spacing: -0.055em;

      font-weight: 500;
    }

    .hero-description {
      max-width: 720px;

      margin-top: 30px;

      color: var(--muted);

      font-size: 16px;
      line-height: 1.7;
    }

    .website-box {
      position: relative;
      z-index: 3;

      margin-top: 36px;

      padding: 24px 26px;

      background: rgba(255, 255, 255, 0.78);

      border:
        1px solid
        rgba(17, 17, 17, 0.07);

      border-radius: 20px;

      backdrop-filter: blur(12px);

      box-shadow:
        0 15px 35px
        rgba(0, 0, 0, 0.045);
    }

    .website-label {
      font-size: 10px;
      font-weight: 900;

      letter-spacing: 0.18em;

      color: #77736c;

      text-transform: uppercase;
    }

    .company-name {
      margin-top: 9px;

      font-size: 25px;
      font-weight: 850;

      letter-spacing: -0.03em;
    }

    .website-url {
      margin-top: 5px;

      color: var(--muted);

      font-size: 13px;

      word-break: break-all;
    }

    /* =========================================================
       HEALTH
       ========================================================= */

    .health-card {
      min-height: 565px;

      padding: 48px 38px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .health-orbit {
      position: relative;

      width: 158px;
      height: 158px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #72dfd5 0%,
          #76c7f4 48%,
          #a795ff 100%
        );

      box-shadow:
        0 20px 45px
        rgba(101, 171, 239, 0.22);

      animation:
        orbitBreathe
        4s
        ease-in-out
        infinite;
    }

    @keyframes orbitBreathe {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.035);
      }
    }

    .health-orbit::before {
      content: "";

      position: absolute;
      inset: 12px;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.16);

      backdrop-filter: blur(2px);
    }

    .health-orbit::after {
      content: "";

      position: absolute;

      inset: -7px;

      z-index: -1;

      border-radius: 50%;

      background:
        conic-gradient(
          from 0deg,
          var(--teal),
          var(--blue),
          var(--violet),
          var(--pink),
          var(--teal)
        );

      opacity: 0.4;
      filter: blur(7px);

      animation:
        ringSpin
        6s
        linear
        infinite;
    }

    @keyframes ringSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .health-word {
      position: relative;
      z-index: 2;

      font-size: 17px;
      font-weight: 900;
    }

    .health-label {
      margin-top: 30px;

      font-size: 11px;
      font-weight: 900;

      letter-spacing: 0.16em;

      text-transform: uppercase;

      color: #77736c;
    }

    .health-status {
      margin-top: 9px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 43px;

      line-height: 1;

      font-weight: 500;
    }

    .health-meta {
      margin-top: 10px;

      color: var(--muted);

      font-size: 13px;
    }

    .health-stats {
      width: 100%;

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 10px;

      margin-top: 35px;
    }

    .health-stat {
      padding: 20px 15px;

      border-radius: 18px;

      background: #f6f5f1;

      text-align: left;
    }

    .health-stat strong {
      display: block;

      font-size: 31px;
      line-height: 1;
    }

    .health-stat span {
      display: block;

      margin-top: 8px;

      font-size: 10px;
      font-weight: 900;

      letter-spacing: 0.15em;

      text-transform: uppercase;

      color: #88847c;
    }

    /* =========================================================
       SECTION CARDS
       ========================================================= */

    .section-card {
      padding: 38px;
    }

    .section-heading {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      gap: 20px;

      margin-bottom: 28px;
    }

    .section-title {
      margin-top: 8px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          34px,
          4vw,
          52px
        );

      line-height: 0.98;

      letter-spacing: -0.045em;

      font-weight: 500;
    }

    .section-number {
      min-width: 45px;
      height: 45px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: #f4f2ec;

      font-size: 12px;
      font-weight: 900;

      transition:
        transform 0.3s ease,
        background 0.3s ease;
    }

    .card:hover .section-number {
      transform:
        rotate(-8deg)
        scale(1.06);
    }

    /* =========================================================
       TECHNICAL
       ========================================================= */

    .technical-card {
      grid-column: 1 / -1;

      background:
        linear-gradient(
          135deg,
          rgba(203, 239, 235, 0.95),
          rgba(255, 255, 255, 0.97) 60%
        );
    }

    .metric-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;
    }

    .metric {
      min-height: 145px;

      padding: 23px;

      border-radius: 22px;

      background:
        rgba(255, 255, 255, 0.74);

      border:
        1px solid
        rgba(0, 82, 77, 0.08);

      display: flex;
      flex-direction: column;

      justify-content: space-between;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .metric:hover {
      transform: translateY(-3px);

      box-shadow:
        0 15px 30px
        rgba(0, 82, 77, 0.08);
    }

    .metric-name {
      font-size: 11px;
      font-weight: 900;

      letter-spacing: 0.13em;

      text-transform: uppercase;

      color: #77736c;
    }

    .metric-value {
      font-size: 39px;
      font-weight: 900;

      letter-spacing: -0.06em;
    }

    .metric-description {
      font-size: 12px;

      color: var(--muted);
    }

    /* =========================================================
       PAGE INFORMATION
       ========================================================= */

    .page-card {
      background:
        linear-gradient(
          135deg,
          #fffefa,
          #f4f1e9
        );
    }

    .page-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;
    }

    .info-block {
      min-height: 120px;

      padding: 22px;

      border-radius: 20px;

      background:
        rgba(255, 255, 255, 0.78);

      border:
        1px solid
        var(--border);
    }

    .info-label {
      font-size: 10px;
      font-weight: 900;

      letter-spacing: 0.14em;

      text-transform: uppercase;

      color: #858179;
    }

    .info-value {
      margin-top: 13px;

      font-size: 19px;
      font-weight: 750;

      line-height: 1.35;

      word-break: break-word;
    }

    .info-sub {
      margin-top: 6px;

      color: var(--muted);

      font-size: 12px;
    }

    /* =========================================================
       SEO
       ========================================================= */

    .seo-card {
      background:
        linear-gradient(
          135deg,
          #efb0df 0%,
          #d4a4f5 45%,
          #7fb9ff 100%
        );

      background-size: 220% 220%;

      animation:
        gradientDrift
        15s
        ease-in-out
        infinite;
    }

    @keyframes gradientDrift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* =========================================================
       ACCESSIBILITY
       ========================================================= */

    .accessibility-card {
      background:
        linear-gradient(
          135deg,
          #6ed4e8 0%,
          #71b9f3 48%,
          #9b8df6 100%
        );

      background-size: 220% 220%;

      animation:
        gradientDrift
        17s
        ease-in-out
        infinite;

      animation-delay: -3s;
    }

    /* =========================================================
       SECURITY
       ========================================================= */

    .security-card {
      background:
        linear-gradient(
          135deg,
          #ffd99c,
          #ffbfa7
        );

      background-size: 220% 220%;

      animation:
        gradientDrift
        19s
        ease-in-out
        infinite;

      animation-delay: -6s;
    }

    /* =========================================================
       SIGNALS
       ========================================================= */

    .signal-list {
      display: grid;
      gap: 10px;
    }

    .signal {
      padding: 20px 21px;

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.72);

      border:
        1px solid
        rgba(255, 255, 255, 0.78);

      backdrop-filter: blur(8px);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .signal:hover {
      transform: translateY(-2px);

      background:
        rgba(255, 255, 255, 0.9);
    }

    .signal-top {
      display: flex;

      align-items: flex-start;

      gap: 10px;
    }

    .signal-icon {
      flex: 0 0 auto;

      width: 27px;
      height: 27px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.7);

      font-size: 12px;
      font-weight: 900;
    }

    .signal-title {
      font-size: 14px;
      font-weight: 850;

      line-height: 1.4;
    }

    .signal-description {
      margin-top: 7px;

      padding-left: 37px;

      color: #716d67;

      font-size: 12px;
      line-height: 1.55;
    }

    .signal.good .signal-icon {
      background: var(--green-light);
      color: #197b58;
    }

    .signal.warning .signal-icon {
      background: var(--yellow-light);
      color: #936d0b;
    }

    .signal.issue .signal-icon {
      background: var(--red-light);
      color: #a83f3f;

      animation:
        issuePulse
        1.8s
        ease-in-out
        infinite;
    }

    @keyframes issuePulse {
      0%,
      100% {
        box-shadow:
          0 0 0 0
          rgba(239, 126, 126, 0.45);
      }

      50% {
        box-shadow:
          0 0 0 6px
          rgba(239, 126, 126, 0);
      }
    }

    /* =========================================================
       FINDINGS
       ========================================================= */

    .findings-card {
      background:
        linear-gradient(
          135deg,
          #fffefa,
          #f0f5f2
        );

      grid-column: 1 / -1;
    }

    .finding-list {
      display: grid;
      gap: 12px;
    }

    .finding {
      position: relative;

      padding: 20px;

      border-radius: 20px;

      background:
        rgba(255, 255, 255, 0.88);

      border:
        1px solid
        var(--border);

      overflow: hidden;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .finding:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 26px
        rgba(17, 17, 17, 0.06);
    }

    /* =========================================================
       FINDING SEVERITY
       ========================================================= */

    .finding-confirmed {
      border-left:
        5px solid
        var(--red);
    }

    .finding-review {
      border-left:
        5px solid
        var(--yellow);
    }

    .finding-recommendation {
      border-left:
        5px solid
        var(--blue);
    }

    .finding-passed {
      border-left:
        5px solid
        var(--green);
    }

    .finding-header {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 16px;
    }

    .finding-main {
      font-size: 14px;
      font-weight: 850;

      line-height: 1.45;

      word-break: break-word;
    }

    .finding-detail {
      margin-top: 7px;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.6;

      word-break: break-word;
    }

    .severity-badge {
      flex: 0 0 auto;

      display: inline-flex;

      align-items: center;
      gap: 6px;

      padding:
        6px
        10px;

      border-radius: 999px;

      font-size: 9px;

      font-weight: 900;

      letter-spacing: 0.10em;

      text-transform: uppercase;

      white-space: nowrap;
    }

    .severity-confirmed {
      background: var(--red-light);
      color: #a83f3f;
    }

    .severity-review {
      background: var(--yellow-light);
      color: #85630b;
    }

    .severity-recommendation {
      background: var(--blue-light);
      color: #28679b;
    }

    .severity-passed {
      background: var(--green-light);
      color: #197b58;
    }

    /* =========================================================
       FINDING META
       ========================================================= */

    .finding-meta {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 13px;
    }

    .finding-meta-item {
      max-width: 100%;

      padding:
        6px
        9px;

      border-radius: 9px;

      background: #f5f4ef;

      color: #77736c;

      font-size: 10px;

      line-height: 1.4;

      word-break: break-all;
    }

    .finding-meta-item strong {
      color: #4e4b46;
    }

    /* =========================================================
       FIX DETAILS
       ========================================================= */

    .fix-details {
      margin-top: 14px;

      border-top:
        1px solid
        rgba(17, 17, 17, 0.07);

      padding-top: 13px;
    }

    .fix-summary {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      cursor: pointer;

      list-style: none;

      user-select: none;

      padding:
        8px
        12px;

      border-radius: 999px;

      background: #111;
      color: white;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .fix-summary:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .fix-summary::-webkit-details-marker {
      display: none;
    }

    .fix-summary::after {
      content: "⌄";

      font-size: 12px;

      transition:
        transform 0.2s ease;
    }

    .fix-details[open]
      .fix-summary::after {
      transform: rotate(180deg);
    }

    .fix-body {
      margin-top: 14px;

      display: grid;

      gap: 12px;
    }

    .fix-summary-text {
      color: #45423d;

      font-size: 13px;

      line-height: 1.6;

      font-weight: 650;
    }

    .fix-steps {
      display: grid;
      gap: 8px;

      padding-left: 18px;
    }

    .fix-step {
      color: #68645d;

      font-size: 12px;

      line-height: 1.55;
    }

    .fix-code {
      padding: 14px;

      border-radius: 14px;

      background: #151515;
      color: #e9f5f2;

      overflow-x: auto;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 11px;

      line-height: 1.6;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .fix-note {
      padding: 12px 14px;

      border-radius: 14px;

      background: var(--blue-light);

      color: #315c7d;

      font-size: 11px;

      line-height: 1.55;
    }

    /* =========================================================
       FRIENDLY SUMMARY
       ========================================================= */

    .patchkite-friendly-summary {
      margin-bottom: 16px;

      padding: 24px 28px;

      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.94),
          rgba(239, 249, 246, 0.96)
        );

      border:
        1px solid
        rgba(255, 255, 255, 0.9);

      box-shadow:
        0 12px 35px
        rgba(20, 30, 29, 0.05);
    }

    .patchkite-friendly-summary.hidden {
      display: none;
    }

    .friendly-summary-inner {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }

    .friendly-summary-title {
      font-size: 17px;
      font-weight: 900;
    }

    .friendly-summary-text {
      margin-top: 5px;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.55;
    }

    .friendly-summary-stats {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }

    .friendly-summary-stat {
      min-width: 72px;

      padding:
        10px
        12px;

      border-radius: 14px;

      background: #f4f3ee;

      text-align: center;
    }

    .friendly-summary-stat strong {
      display: block;

      font-size: 20px;
      line-height: 1;
    }

    .friendly-summary-stat span {
      display: block;

      margin-top: 5px;

      color: #89857d;

      font-size: 9px;

      font-weight: 900;

      letter-spacing: 0.08em;

      text-transform: uppercase;
    }

    /* =========================================================
       EMPTY FINDINGS
       ========================================================= */

    .empty-findings {
      padding: 30px;

      text-align: center;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          #ddf6eb,
          #e9f9f6
        );

      color: #26765d;

      font-weight: 750;

      background-size: 220% 220%;

      animation:
        gradientDrift
        12s
        ease-in-out
        infinite;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .audit-footer {
      margin-top: 16px;

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 16px;
    }

    .footer-card {
      padding: 28px 32px;

      background:
        rgba(255, 255, 255, 0.82);

      border:
        1px solid
        rgba(255, 255, 255, 0.9);

      border-radius: 24px;

      box-shadow:
        0 12px 35px
        rgba(20, 30, 29, 0.05);
    }

    .footer-label {
      font-size: 10px;
      font-weight: 900;

      letter-spacing: 0.16em;

      text-transform: uppercase;

      color: #8b877f;
    }

    .footer-value {
      margin-top: 9px;

      font-size: 14px;
      font-weight: 750;

      word-break: break-word;
    }

    /* =========================================================
       LOADING / ERROR
       ========================================================= */

    .loading-card,
    .error-card {
      min-height: 400px;

      display: grid;
      place-items: center;

      padding: 50px;

      text-align: center;
    }

    .loading-card h2,
    .error-card h2 {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 45px;

      font-weight: 500;
    }

    .loading-card p,
    .error-card p {
      max-width: 600px;

      margin: 15px auto 0;

      color: var(--muted);

      line-height: 1.65;
    }

    .error-card {
      background:
        linear-gradient(
          135deg,
          #fde4e4,
          #fffefa
        );
    }

    .loading-card .eyebrow {
      background:
        linear-gradient(
          90deg,
          #69655e 0%,
          #a8a49a 50%,
          #69655e 100%
        );

      background-size: 200% 100%;

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;
      color: transparent;

      animation:
        shimmerSweep
        1.6s
        ease-in-out
        infinite;
    }

    @keyframes shimmerSweep {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 1050px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero-card,
      .health-card {
        min-height: auto;
      }

      .metric-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .topbar,
      .report-shell {
        width:
          min(
            calc(100% - 22px),
            1260px
          );
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;

        justify-content: flex-start;
      }

      .hero-card {
        padding:
          36px
          24px
          28px;

        border-radius: 25px;
      }

      .hero-title {
        font-size: 51px;
      }

      .hero-description {
        font-size: 14px;
      }

      .health-card {
        padding:
          40px
          24px;
      }

      .section-card {
        padding:
          25px
          20px;
      }

      .section-title {
        font-size: 38px;
      }

      .metric-grid,
      .page-grid,
      .audit-footer {
        grid-template-columns: 1fr;
      }

      .metric {
        min-height: 125px;
      }

      .health-orbit {
        width: 140px;
        height: 140px;
      }

      .finding-header {
        flex-direction: column;
      }

      .severity-badge {
        align-self: flex-start;
      }

      .friendly-summary-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .friendly-summary-stats {
        width: 100%;
      }
    }

    @media (max-width: 420px) {
      .brand-group {
        flex-wrap: wrap;
      }

      .top-actions {
        display: grid;

        grid-template-columns:
          1fr
          1fr;
      }

      .top-btn {
        width: 100%;
      }

      .top-btn.primary {
        grid-column: 1 / -1;
      }

      .hero-title {
        font-size: 43px;
      }

      .health-status {
        font-size: 36px;
      }

      .section-title {
        font-size: 34px;
      }

      .section-number {
        min-width: 38px;
        height: 38px;
      }

      .friendly-summary-stats {
        display: grid;

        grid-template-columns:
          repeat(3, 1fr);
      }

      .friendly-summary-stat {
        min-width: 0;
      }
    }

    /* =========================================================
       PRINT
       ========================================================= */

    @media print {
      body {
        background: white;
      }

      body::before,
      body::after {
        display: none;
      }

      .topbar {
        display: none;
      }

      .report-shell {
        width: 100%;
        margin: 0;
      }

      .card,
      .footer-card {
        box-shadow: none;

        break-inside: avoid;
      }

      .grid {
        gap: 10px;
      }

      .hero-title {
        font-size: 55px;
      }

      .fix-details {
        display: block;
      }

      .fix-details[open]
        .fix-summary {
        display: none;
      }

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: 0.001ms !important;

        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       TOP BAR
       ========================================================= -->

  <header class="topbar">

    <div class="brand-group">

      <div class="brand-text">
        PATCHKITE
      </div>

      <span
        class="live-indicator"
        aria-hidden="true"
      >
        <span class="live-dot"></span>
        Live
      </span>

    </div>


    <div class="top-actions">

      <button
        class="top-btn"
        id="backButton"
        type="button"
      >
        ← Back
      </button>

      <button
        class="top-btn"
        id="copyButton"
        type="button"
      >
        Copy report
      </button>

      <button
        class="top-btn primary"
        id="printButton"
        type="button"
      >
        Print
      </button>

    </div>

  </header>


  <!-- =========================================================
       REPORT
       ========================================================= -->

  <main class="report-shell">

    <div id="reportRoot">

      <section class="card loading-card">

        <div>

          <div class="eyebrow">
            PATCHKITE
          </div>

          <h2>
            Preparing your audit.
          </h2>

          <p>
            Loading the latest website audit report...
          </p>

        </div>

      </section>

    </div>

  </main>


  <script>

    /* =========================================================
       PATCHKITE REPORT ENGINE
       ========================================================= */

    (() => {

      "use strict";


      const STORAGE_KEY =
        "patchkite.latestAuditReport";


      const $ = selector =>
        document.querySelector(selector);


      /* =======================================================
         HELPERS
         ======================================================= */

      function escapeHtml(value) {

        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      }


      function safeNumber(value) {

        const number = Number(value);

        return Number.isFinite(number)
          ? number
          : 0;

      }


      function safeArray(value) {

        return Array.isArray(value)
          ? value
          : [];

      }


      function getLatestReport() {

        try {

          const raw =
            localStorage.getItem(STORAGE_KEY);

          if (!raw) {
            return null;
          }

          return JSON.parse(raw);

        } catch (error) {

          console.error(
            "Patchkite report data could not be read:",
            error
          );

          return null;
        }

      }


      function getUrlFromReport(report) {

        return (
          report?.scannedUrl ||
          report?.url ||
          report?.data?.url ||
          report?.data?.website ||
          ""
        );

      }


      function getData(report) {

        return report?.data ||
          report ||
          {};

      }


      function getPage(data) {

        return data.page || {};

      }


      function getSeo(data) {

        return (
          data.seo ||
          data.search ||
          data.seoSignals ||
          {}
        );

      }


      function getAccessibility(data) {

        return (
          data.accessibility ||
          data.a11y ||
          {}
        );

      }


      function getSecurity(data) {

        return (
          data.security ||
          data.securityHeaders ||
          {}
        );

      }


      function getFindings(data) {

        return safeArray(
          data.findings ||
          data.issues ||
          []
        );

      }


      /* =======================================================
         COMPANY
         ======================================================= */

      function getCompanyName(url) {

        if (!url) {
          return "Website";
        }

        try {

          const parsed =
            new URL(
              url.startsWith("http")
                ? url
                : "https://" + url
            );

          const hostname =
            parsed.hostname
              .replace(/^www\./i, "");

          const firstPart =
            hostname
              .split(".")[0]
              .trim();

          if (!firstPart) {
            return "Website";
          }

          return firstPart
            .replace(/[-_]+/g, " ")
            .replace(
              /\b\w/g,
              letter =>
                letter.toUpperCase()
            );

        } catch {

          return "Website";

        }

      }


      /* =======================================================
         COUNTS
         ======================================================= */

      function getLinkTotal(data) {

        return safeNumber(
          data.totalLinks ??
          data.linksChecked ??
          data.links?.checked ??
          data.links?.total
        );

      }


      function getBrokenLinks(data) {

        return safeNumber(
          data.brokenLinks ??
          data.links?.broken
        );

      }


      function getImageTotal(data) {

        return safeNumber(
          data.totalImages ??
          data.imagesChecked ??
          data.images?.checked ??
          data.images?.total
        );

      }


      function getMissingImages(data) {

        return safeNumber(
          data.missingImages ??
          data.images?.missing
        );

      }


      function getStylesheetTotal(data) {

        return safeNumber(
          data.totalStylesheets ??
          data.stylesheetsChecked ??
          data.stylesheets?.checked ??
          data.stylesheets?.total
        );

      }


      function getBrokenStylesheets(data) {

        return safeNumber(
          data.brokenStylesheets ??
          data.stylesheets?.broken
        );

      }


      function getScriptTotal(data) {

        return safeNumber(
          data.totalScripts ??
          data.scriptsChecked ??
          data.scripts?.checked ??
          data.scripts?.total
        );

      }


      function getBrokenScripts(data) {

        return safeNumber(
          data.brokenScripts ??
          data.scripts?.broken
        );

      }


      /* =======================================================
         SEVERITY NORMALIZATION
         ======================================================= */

      function normalizeSeverity(item) {

        const raw = String(
          item?.severity ||
          item?.status ||
          ""
        ).toLowerCase().trim();


        if (
          raw.includes("confirmed") ||
          raw.includes("critical") ||
          raw.includes("broken") ||
          raw === "issue" ||
          raw === "error"
        ) {

          return {
            key: "confirmed",
            label: "Confirmed problem",
            icon: "🔴"
          };

        }


        if (
          raw.includes("review") ||
          raw.includes("warning") ||
          raw.includes("uncertain")
        ) {

          return {
            key: "review",
            label: "Needs review",
            icon: "🟡"
          };

        }


        if (
          raw.includes("recommend") ||
          raw.includes("suggest")
        ) {

          return {
            key: "recommendation",
            label: "Recommendation",
            icon: "🔵"
          };

        }


        if (
          raw.includes("passed") ||
          raw.includes("pass") ||
          raw === "good"
        ) {

          return {
            key: "passed",
            label: "Passed",
            icon: "🟢"
          };

        }


        /*
         * Backend findings without an explicit severity
         * are treated as review items rather than confirmed
         * problems.
         */

        return {
          key: "review",
          label: "Needs review",
          icon: "🟡"
        };

      }


      /* =======================================================
         HEALTH
         ======================================================= */

      function getIssueCount(data) {

        const explicit =
          data.health?.confirmedIssues ??
          data.confirmedIssues ??
          data.issueCount ??
          data.issuesCount;


        if (
          explicit !== undefined &&
          explicit !== null
        ) {

          return safeNumber(explicit);

        }


        return getFindings(data)
          .filter(item =>
            normalizeSeverity(item).key ===
            "confirmed"
          )
          .length;

      }


      function getReviewCount(data) {

        const explicit =
          data.health?.reviewItems ??
          data.reviewItems ??
          data.reviewCount ??
          data.itemsToReview;


        if (
          explicit !== undefined &&
          explicit !== null
        ) {

          return safeNumber(explicit);

        }


        return getFindings(data)
          .filter(item =>
            normalizeSeverity(item).key ===
            "review"
          )
          .length;

      }


      function getHealth(data) {

        const explicit =
          typeof data.health === "string"
            ? data.health
            : data.health?.status ||
              data.overallHealth ||
              data.status;


        if (
          typeof explicit === "string" &&
          explicit.trim()
        ) {

          return explicit;

        }


        if (getIssueCount(data) > 0) {
          return "Needs attention";
        }


        return "Healthy";

      }


      /* =======================================================
         SIGNALS
         ======================================================= */

      function makeSignal(
        title,
        description,
        status = "good"
      ) {

        return {
          title,
          description,
          status
        };

      }


      function signalIcon(status) {

        if (status === "issue") {
          return "!";
        }

        if (status === "warning") {
          return "△";
        }

        return "✓";

      }


      function signalHtml(signal) {

        return `
          <div class="signal ${escapeHtml(signal.status)}">

            <div class="signal-top">

              <div class="signal-icon">
                ${signalIcon(signal.status)}
              </div>

              <div class="signal-title">
                ${escapeHtml(signal.title)}
              </div>

            </div>

            <div class="signal-description">
              ${escapeHtml(signal.description)}
            </div>

          </div>
        `;

      }


      /* =======================================================
         SEO
         ======================================================= */

      function buildSeoSignals(data) {

        const seo = getSeo(data);
        const page = getPage(data);

        const signals = [];


        const title =
          page.title ??
          seo.title ??
          data.pageTitle ??
          "";


        if (title) {

          signals.push(
            makeSignal(
              "Page title detected",
              `${title} · ${title.length} characters`,
              "good"
            )
          );

        } else {

          signals.push(
            makeSignal(
              "Missing page title",
              "A page title should be added.",
              "warning"
            )
          );

        }


        const metaDescription =
          page.metaDescription ??
          seo.metaDescription ??
          seo.description;


        if (metaDescription) {

          signals.push(
            makeSignal(
              "Meta description detected",
              "A page description was found.",
              "good"
            )
          );

        } else {

          signals.push(
            makeSignal(
              "Missing meta description",
              "Consider adding a concise description for search previews.",
              "warning"
            )
          );

        }


        const h1 =
          page.h1 ??
          page.h1Count ??
          seo.h1 ??
          data.h1Count;


        if (safeNumber(h1) > 0) {

          signals.push(
            makeSignal(
              `${safeNumber(h1)} H1 heading found`,
              "A primary page heading was detected.",
              "good"
            )
          );

        } else {

          signals.push(
            makeSignal(
              "No H1 heading found",
              "Review whether the page needs a primary heading.",
              "warning"
            )
          );

        }


        const canonical =
          page.canonical ??
          seo.canonical;


        if (canonical) {

          signals.push(
            makeSignal(
              "Canonical URL detected",
              "A canonical URL was found.",
              "good"
            )
          );

        } else {

          signals.push(
            makeSignal(
              "Missing canonical URL",
              "Review whether a canonical URL is appropriate for this page.",
              "warning"
            )
          );

        }


        return signals;

      }


      /* =======================================================
         ACCESSIBILITY
         ======================================================= */

      function buildAccessibilitySignals(data) {

        const accessibility =
          getAccessibility(data);


        const missingAlt =
          safeNumber(
            accessibility.imagesWithoutAlt ??
            accessibility.missingAlt ??
            accessibility.imagesMissingAlt ??
            accessibility.missingAltText
          );


        const emptyAlt =
          safeNumber(
            accessibility.emptyAltImages ??
            accessibility.emptyAlt ??
            accessibility.emptyAltAttributes
          );


        const unlabeledForms =
          safeNumber(
            accessibility.formsWithoutLabels ??
            accessibility.unlabeledForms ??
            accessibility.formFieldsWithoutLabels ??
            accessibility.unlabeledFormFields
          );


        return [

          makeSignal(
            `${missingAlt} images missing alt text`,
            "Images that may need descriptive alternative text.",
            missingAlt > 0
              ? "warning"
              : "good"
          ),

          makeSignal(
            `${emptyAlt} empty alt attributes`,
            "Images using an empty alt attribute.",
            emptyAlt > 0
              ? "warning"
              : "good"
          ),

          makeSignal(
            `${unlabeledForms} form fields without labels`,
            "Form controls that may need accessible labels.",
            unlabeledForms > 0
              ? "warning"
              : "good"
          )

        ];

      }


      /* =======================================================
         SECURITY
         ======================================================= */

      function buildSecuritySignals(data, url) {

        const security =
          getSecurity(data);

        const signals = [];


        let httpsOkay = false;


        try {

          httpsOkay =
            new URL(url).protocol ===
            "https:";

        } catch {

          httpsOkay = false;

        }


        signals.push(
          makeSignal(
            httpsOkay
              ? "HTTPS connection detected"
              : "HTTPS connection not detected",

            httpsOkay
              ? "The audited website uses a secure HTTPS connection."
              : "The audited website does not appear to use HTTPS.",

            httpsOkay
              ? "good"
              : "issue"
          )
        );


        const hsts =
          security.hsts ??
          security.strictTransportSecurity ??
          security["strict-transport-security"];


        signals.push(
          makeSignal(
            hsts
              ? "Strict-Transport-Security detected"
              : "Strict-Transport-Security",

            hsts
              ? "The audited response includes an HSTS security header."
              : "Header was not detected on the audited response.",

            hsts
              ? "good"
              : "warning"
          )
        );


        const csp =
          security.csp ??
          security.contentSecurityPolicy ??
          security["content-security-policy"];


        signals.push(
          makeSignal(
            csp
              ? "Content-Security-Policy detected"
              : "Content-Security-Policy",

            csp
              ? "A Content-Security-Policy header was detected."
              : "Header was not detected on the audited response.",

            csp
              ? "good"
              : "warning"
          )
        );


        return signals;

      }


      /* =======================================================
         FINDINGS
         ======================================================= */

      function normalizeFinding(item) {

        if (typeof item === "string") {

          return {

            title: item,

            detail: "",

            severity: normalizeSeverity({}),

            fix: null,

            sourcePage: "",
            resourceUrl: ""

          };

        }


        const severity =
          normalizeSeverity(item);


        return {

          title:
            item.title ||
            item.message ||
            item.name ||
            item.type ||
            "Audit finding",


          detail:
            item.detail ||
            item.description ||
            item.reason ||
            item.url ||
            item.value ||
            item.statusText ||
            "",


          severity,


          fix:
            item.fix ||
            null,


          sourcePage:
            item.sourcePage ||
            item.source ||
            item.page ||
            item.fix?.sourcePage ||
            "",


          resourceUrl:
            item.resourceUrl ||
            item.url ||
            item.targetUrl ||
            item.fix?.resourceUrl ||
            ""

        };

      }


      /* =======================================================
         FIX HELPERS
         ======================================================= */

      function getFixSummary(fix) {

        if (!fix) {
          return "";
        }

        return (
          fix.summary ||
          fix.description ||
          fix.whatToDo ||
          ""
        );

      }


      function getFixSteps(fix) {

        if (!fix) {
          return [];
        }

        if (Array.isArray(fix.steps)) {
          return fix.steps;
        }

        return [];

      }


      function getCodeHint(fix) {

        if (!fix?.codeHint) {
          return "";
        }


        if (typeof fix.codeHint === "string") {
          return fix.codeHint;
        }


        return (
          fix.codeHint.search ||
          fix.codeHint.example ||
          fix.codeHint.code ||
          fix.codeHint.note ||
          ""
        );

      }


      function getFixNote(fix) {

        if (!fix) {
          return "";
        }

        return (
          fix.note ||
          fix.warning ||
          ""
        );

      }


      function renderFix(fix) {

        if (!fix) {
          return "";
        }


        const summary =
          getFixSummary(fix);


        const steps =
          getFixSteps(fix);


        const codeHint =
          getCodeHint(fix);


        const note =
          getFixNote(fix);


        if (
          !summary &&
          !steps.length &&
          !codeHint &&
          !note
        ) {

          return "";

        }


        return `
          <details class="fix-details">

            <summary class="fix-summary">
              Fix ▾
            </summary>

            <div class="fix-body">

              ${
                summary
                  ? `
                    <div class="fix-summary-text">
                      ${escapeHtml(summary)}
                    </div>
                  `
                  : ""
              }


              ${
                steps.length
                  ? `
                    <ol class="fix-steps">
                      ${steps.map(step => `
                        <li class="fix-step">
                          ${escapeHtml(step)}
                        </li>
                      `).join("")}
                    </ol>
                  `
                  : ""
              }


              ${
                codeHint
                  ? `
                    <div class="fix-code">
                      ${escapeHtml(codeHint)}
                    </div>
                  `
                  : ""
              }


              ${
                note
                  ? `
                    <div class="fix-note">
                      ${escapeHtml(note)}
                    </div>
                  `
                  : ""
              }

            </div>

          </details>
        `;

      }

         FINDING HTML
         ======================================================= */

        const normalized =
          normalizeFinding(item);

          normalized.severity;


        return `

                }

              </div>


              <span
                class="
                  severity-badge
                  severity-${escapeHtml(
                    severity.key
                  )}
                "
              >
                ${severity.icon}
                ${escapeHtml(
                  severity.label
                )}
              </span>

            </div>


            ${
              normalized.sourcePage ||

                ? `

      function renderFindings(data) {

        const findings =
          getFindings(data);


        if (!findings.length) {

          return `

              No active findings were recorded for this audit.

        return `

      function renderFriendlySummary(data) {

        const issues =
          getIssueCount(data);


        const review =
          getReviewCount(data);


        const findings =
          getFindings(data);


        const recommendations =
          findings.filter(

        const passed =
          findings.filter(

          ).length;


        let title =
          "Audit looks healthy.";

          "No confirmed problems were recorded by Patchkite.";

          description =
            "Open the relevant finding and use Fix ▾ for the available remediation steps.";

        } else if (review > 0) {

          title =
            "Nothing was confirmed broken.";

          description =
            "Some items need manual review before they can be treated as problems.";

        }


        return `

        text +=

        text +=
          `Images checked: ${getImageTotal(data)}\n`;

        text +=
          `Missing images: ${getMissingImages(data)}\n`;

          `Stylesheets checked: ${getStylesheetTotal(data)}\n`;

        text +=
          `Broken stylesheets: ${getBrokenStylesheets(data)}\n`;

        text +=
          `Scripts checked: ${getScriptTotal(data)}\n`;

        text +=
          `Broken scripts: ${getBrokenScripts(data)}\n\n`;

          "PAGE\n";

        text +=
          "--------------------------------\n";

          `Title: ${page.title || "Not detected"}\n`;

        text +=
          `Title length: ${
            page.titleLength ??
            page.title?.length ??
            0
          }\n`;

        text +=
          `H1: ${
            page.h1 ??
            page.h1Count ??
            0
          }\n`;

        text +=
          `H2: ${
            page.h2 ??
            page.h2Count ??
            0
          }\n`;

              ? "Yes"
              : "No"

          "FINDINGS\n";

          "--------------------------------\n";

          text +=

          findings.forEach(

              const normalized =
                normalizeFinding(item);

                `${normalized.title}\n`;

              }

            }
          );

        }


        text +=
          "\n--------------------------------\n";

        text +=
          "Generated by Patchkite\n";


        return text;

      }


      async function copyReport() {

        const report =
          getLatestReport();


        if (!report) {
          return;
        }


        const text =
          buildCopyText(report);


        try {

          await navigator.clipboard
            .writeText(text);


          const button =
            $("#copyButton");


          if (button) {

            const original =
              button.textContent;


            button.textContent =
              "Copied ✓";


            setTimeout(
              () => {
                button.textContent =
                  original;
              },
              1500
            );

          }

        } catch (error) {

          console.error(
            "Copy failed:",
            error
          );

          alert(
            "Copy was not available in this browser."
          );

        }

      }


      /* =======================================================
         EVENTS
         ======================================================= */

      $("#backButton")?.addEventListener(
        "click",
        () => {
          window.location.href = "/";
        }
      );


      $("#copyButton")?.addEventListener(
        "click",
        copyReport
      );


      $("#printButton")?.addEventListener(
        "click",
        () => {
          window.print();
        }
      );


      /* =======================================================
         LOAD REPORT
         ======================================================= */

      const report =
        getLatestReport();


      if (!report) {

        $("#reportRoot").innerHTML = `

          <section class="card error-card">

            <div>

              <div class="eyebrow">
                PATCHKITE
              </div>

              <h2>
                No audit report found.
              </h2>

              <p>
                Run a website scan first.
                Once the scan finishes,
                Patchkite will save the latest
                audit here automatically.
              </p>

            </div>

          </section>

        `;

      } else {

        renderReport(report);

      }

    })();

  </script>

</body>
</html>
